<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#101918" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="15%" stop-color="#ffefa8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="85%" stop-color="#4a350b"/>
      <stop offset="100%" stop-color="#ffefa8"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101918"/>
      <stop offset="20%" stop-color="#d4af37" stop-opacity="0.75"/>
      <stop offset="48%" stop-color="#ffefa8" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#ffefa8" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#101918"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffefa8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffefa8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#d4af37" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#d4af37" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="215" rx="140" ry="22" fill="#000000" opacity="0.7"/>
        <ellipse cx="0" cy="213" rx="100" ry="14" fill="#d4af37" opacity="0.22"/>

        <polygon points="-80,-105 80,-105 106,-75 106,165 80,195 -80,195 -106,165 -106,-75" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        
        <line x1="-80" y1="-105" x2="-80" y2="195" stroke="url(#metalG)" stroke-width="1.2" opacity="0.5"/>
        <line x1="80" y1="-105" x2="80" y2="195" stroke="url(#metalG)" stroke-width="1.2" opacity="0.5"/>
        <line x1="-100" y1="-70" x2="-100" y2="160" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

        <g opacity="0.35" transform="translate(0, 45)">
          <circle cx="0" cy="0" r="70" fill="none" stroke="url(#metalG)" stroke-width="1.5"/>
          <circle cx="0" cy="0" r="58" fill="none" stroke="url(#metalG)" stroke-width="0.8" stroke-dasharray="4,3"/>
          <polygon points="0,-65 18,-18 65,0 18,18 0,65 -18,18 -65,0 -18,-18" fill="none" stroke="url(#metalG)" stroke-width="1"/>
          <polygon points="-46,-46 0,-25 46,-46 25,0 46,46 0,25 -46,46 -25,0" fill="none" stroke="url(#metalG)" stroke-width="0.8"/>
        </g>

        
    <!-- Label Cartouche -->
    <rect x="-82.0" y="-44.0" width="164" height="178" rx="8" fill="#111216" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-77.0" y="-39.0" width="154" height="168" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -18.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="4.0" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#cfc7b8" text-anchor="middle">LATTAFA PRIDE</text>
    <line x1="-62.0" y1="12.0" x2="62.0" y2="12.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="45.0" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11.2" font-weight="700" letter-spacing="1.1" fill="url(#metalG)" text-anchor="middle"><tspan x="0" dy="0">ART OF ARABIA</tspan><tspan x="0" dy="14">I</tspan></text>
    
    <line x1="-58.0" y1="96.0" x2="58.0" y2="96.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="111.0" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#b0a594" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="124.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <polygon points="-48,-105 -35,-140 35,-140 48,-105" fill="url(#metalG)"/>
        
        <polygon points="-42,-228 42,-228 62,-185 45,-140 -45,-140 -62,-185" fill="url(#metalG)" stroke="#ffefa8" stroke-width="1.8"/>
        <circle cx="0" cy="-184" r="15" fill="#111216" stroke="url(#metalG)" stroke-width="1.2"/>
        <polygon points="0,-193 4,-186 11,-184 4,-182 0,-175 -4,-182 -11,-184 -4,-186" fill="url(#metalG)"/>
        
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#d4af37" opacity="0.85" text-anchor="middle">CITRUS SPICY WOODY</text>
</svg>