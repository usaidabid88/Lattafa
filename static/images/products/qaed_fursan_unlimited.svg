<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#d9d3c5" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#211f1c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9d3c5"/>
      <stop offset="85%" stop-color="#4a350b"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#211f1c"/>
      <stop offset="20%" stop-color="#d9d3c5" stop-opacity="0.75"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#d9d3c5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#211f1c"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#d9d3c5" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#d9d3c5" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="210" rx="145" ry="22" fill="#000000" opacity="0.7"/>
        <ellipse cx="0" cy="208" rx="105" ry="14" fill="#d9d3c5" opacity="0.25"/>

        <rect x="-110" y="-85" width="220" height="280" rx="14" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="3"/>
        <rect x="-104" y="145" width="208" height="46" rx="8" fill="url(#baseG)" opacity="0.95"/>
        <line x1="-104" y1="145" x2="104" y2="145" stroke="#ffffff" stroke-width="1.2" opacity="0.7"/>

        <line x1="-96" y1="-75" x2="-96" y2="180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.38"/>
        
        
    <!-- Label Cartouche -->
    <rect x="-86.0" y="-69.5" width="172" height="175" rx="8" fill="#111216" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-81.0" y="-64.5" width="162" height="165" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -43.5)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="-21.5" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#cfc7b8" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-66.0" y1="-13.5" x2="66.0" y2="-13.5" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="16" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="url(#metalG)" text-anchor="middle"><tspan x="0" dy="0">QAED AL FURSAN</tspan><tspan x="0" dy="14">UNLIMITED</tspan></text>
    
    <line x1="-62.0" y1="67.5" x2="62.0" y2="67.5" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="82.5" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#b0a594" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="95.5" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">90ML</text>
    

        <rect x="-40" y="-125" width="80" height="42" rx="3" fill="url(#metalG)"/>
        <rect x="-56" y="-220" width="112" height="98" rx="8" fill="url(#metalG)" stroke="#ffffff" stroke-width="2"/>
        <rect x="-46" y="-210" width="92" height="78" rx="4" fill="none" stroke="#121316" stroke-width="1.5"/>
        
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#d9d3c5" opacity="0.85" text-anchor="middle">CREAMY COCONUT GOURMAND</text>
</svg>