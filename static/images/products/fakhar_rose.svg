<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Studio Ambient Lighting & Radial Bloom -->
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#df92a5" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#2d0c15" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <!-- Polished Stone Pedestal Horizon Gradient -->
    <linearGradient id="pedestalG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df92a5" stop-opacity="0.22"/>
      <stop offset="15%" stop-color="#121317" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Metallic Specular Profile -->
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="16%" stop-color="#fff8df" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#fde2ea"/>
      <stop offset="65%" stop-color="#df92a5"/>
      <stop offset="85%" stop-color="#2a1f0a"/>
      <stop offset="100%" stop-color="#fde2ea"/>
    </linearGradient>

    <!-- Glass Refraction & Body Material -->
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="12%" stop-color="#2d0c15"/>
      <stop offset="32%" stop-color="#df92a5" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#fde2ea" stop-opacity="0.96"/>
      <stop offset="68%" stop-color="#df92a5" stop-opacity="0.82"/>
      <stop offset="88%" stop-color="#2d0c15"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fde2ea" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e34"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="plaqueShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio Background Wall -->
  <rect width="1200" height="1500" fill="url(#ambG)"/>
  
  <!-- Subtle Studio Pedestal Horizon Surface -->
  <rect x="0" y="1100" width="1200" height="400" fill="url(#pedestalG)"/>
  <line x1="0" y1="1100" x2="1200" y2="1100" stroke="#df92a5" stroke-width="0.8" opacity="0.35"/>

  <!-- Multi-Tier Contact Shadows -->
  <ellipse cx="600" cy="1150" rx="340" ry="42" fill="#000000" opacity="0.5" filter="url(#softShadow)"/>
  <ellipse cx="600" cy="1142" rx="250" ry="20" fill="#000000" opacity="0.85"/>

  <!-- Border Passepartout -->
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#df92a5" stroke-width="1.2" opacity="0.28"/>
  <rect x="52" y="52" width="1096" height="1396" fill="none" stroke="#df92a5" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.18"/>

  <!-- Centered Flacon Geometry (Scaled 1.85x into 1200x1500 frame) -->
  <g transform="translate(600, 720) scale(1.85)" filter="url(#flaconShadow)">
    
            <ellipse cx="0" cy="215" rx="140" ry="22" fill="#000000" opacity="0.65"/>
            <path d="M-105,-85 L105,-85 L105,100 Q105,195 0,205 Q-105,195 -105,100 Z" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.8"/>
            <line x1="-90" y1="-75" x2="-90" y2="120" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.4"/>
            
        <!-- Embossed Label Cartouche Plaque -->
        <g filter="url(#plaqueShadow)">
          <rect x="-80.0" y="-59.0" width="160" height="174" rx="10" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="2.2"/>
          <rect x="-75.0" y="-54.0" width="150" height="164" rx="7" fill="none" stroke="url(#metalG)" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.65"/>
          <rect x="-72.0" y="-51.0" width="144" height="55.7" rx="5" fill="url(#labelSheen)" opacity="0.18"/>
          
          <!-- Crest Emblem -->
          <g transform="translate(0, -35.0)">
            <circle cx="0" cy="0" r="10" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
            <polygon points="0,-6.5 2,-2 6.5,0 2,2 0,6.5 -2,2 -6.5,0 -2,-2" fill="url(#metalG)"/>
          </g>
          
          <!-- Brand Header -->
          <text x="0" y="-14.0" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.2" fill="#e8dcc4" text-anchor="middle">LATTAFA PERFUMES</text>
          <line x1="-62.0" y1="-6.0" x2="62.0" y2="-6.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.55"/>
          
          <!-- Perfume Name -->
          <text x="0" y="39.0" font-family="'Cinzel', serif" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="url(#metalG)" text-anchor="middle">FAKHAR ROSE</text>
          
          <!-- Concentration & Volume Details -->
          <line x1="-58.0" y1="79.0" x2="58.0" y2="79.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.55"/>
          <text x="0" y="93.0" font-family="'Inter', sans-serif" font-size="6.2" font-weight="500" letter-spacing="1.6" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
          <text x="0" y="106.0" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="url(#metalG)" text-anchor="middle">100ML</text>
        </g>
        
            <polygon points="-50,-85 -30,-125 30,-125 50,-85" fill="url(#metalG)"/>
            <path d="M-45,-140 Q-48,-228 0,-230 Q48,-228 45,-140 Z" fill="url(#metalG)" stroke="#fde2ea" stroke-width="1.8"/>
            <circle cx="0" cy="-234" r="7" fill="url(#metalG)"/>
            
        <!-- Studio Specular Highlights -->
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.08"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.24"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
        
  </g>

  <!-- Bottom Olfactory Classification Tagline -->
  <text x="600" y="1410" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#df92a5" opacity="0.85" text-anchor="middle">FLORAL FRUITY</text>
</svg>