<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#df92a5" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#2d0c15" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="15%" stop-color="#fde2ea"/>
      <stop offset="50%" stop-color="#df92a5"/>
      <stop offset="85%" stop-color="#4a350b"/>
      <stop offset="100%" stop-color="#fde2ea"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d0c15"/>
      <stop offset="20%" stop-color="#df92a5" stop-opacity="0.75"/>
      <stop offset="48%" stop-color="#fde2ea" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#fde2ea" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#df92a5" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#2d0c15"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#fde2ea" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#fde2ea" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#df92a5" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#df92a5" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="215" rx="140" ry="22" fill="#000000" opacity="0.65"/>
        <ellipse cx="0" cy="213" rx="100" ry="14" fill="#df92a5" opacity="0.2"/>

        <path d="M-105,-85 L105,-85 L105,100 Q105,195 0,205 Q-105,195 -105,100 Z" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        <path d="M-95,-75 L95,-75 L95,95 Q95,185 0,195 Q-95,185 -95,95 Z" fill="none" stroke="#fde2ea" stroke-width="1" opacity="0.4"/>

        <line x1="-90" y1="-75" x2="-90" y2="120" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>

        
    <!-- Label Cartouche -->
    <rect x="-80.0" y="-58.0" width="160" height="172" rx="8" fill="#111216" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-75.0" y="-53.0" width="150" height="162" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -32.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="-10.0" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#cfc7b8" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-60.0" y1="-2.0" x2="60.0" y2="-2.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="40" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="13" font-weight="700" letter-spacing="2" fill="url(#metalG)" text-anchor="middle">FAKHAR ROSE</text>
    
    <line x1="-56.0" y1="76.0" x2="56.0" y2="76.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="91.0" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#b0a594" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="104.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <polygon points="-50,-85 -30,-125 30,-125 50,-85" fill="url(#metalG)"/>
        <rect x="-30" y="-138" width="60" height="15" rx="2" fill="url(#metalG)"/>
        
        <path d="M-45,-138 Q-48,-225 0,-228 Q48,-225 45,-138 Z" fill="url(#metalG)" stroke="#fde2ea" stroke-width="1.5"/>
        <circle cx="0" cy="-233" r="6" fill="url(#metalG)"/>
        
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#df92a5" opacity="0.85" text-anchor="middle">FLORAL FRUITY</text>
</svg>