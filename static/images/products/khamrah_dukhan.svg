<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#9c5825" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#120a05" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="15%" stop-color="#d6945e"/>
      <stop offset="50%" stop-color="#9c5825"/>
      <stop offset="85%" stop-color="#4a350b"/>
      <stop offset="100%" stop-color="#d6945e"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#120a05"/>
      <stop offset="20%" stop-color="#9c5825" stop-opacity="0.75"/>
      <stop offset="48%" stop-color="#d6945e" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#d6945e" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#9c5825" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#120a05"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#d6945e" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#d6945e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#9c5825" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#9c5825" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="210" rx="145" ry="22" fill="#000000" opacity="0.65"/>
        <ellipse cx="0" cy="208" rx="110" ry="14" fill="#9c5825" opacity="0.18"/>
        <rect x="-115" y="-85" width="230" height="280" rx="16" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        <rect x="-110" y="150" width="220" height="40" rx="10" fill="url(#baseG)" opacity="0.9"/>
        <line x1="-110" y1="150" x2="110" y2="150" stroke="#d6945e" stroke-width="1.2" opacity="0.6"/>
        
        <path d="M-105,40 L-60,95 L-15,40 L30,95 L75,40 L105,75" fill="none" stroke="#d6945e" stroke-width="1.2" opacity="0.25"/>
        <path d="M-105,95 L-60,40 L-15,95 L30,40 L75,95 L105,60" fill="none" stroke="#d6945e" stroke-width="1.2" opacity="0.25"/>
        <path d="M-105,95 L-60,150 L-15,95 L30,150 L75,95 L105,130" fill="none" stroke="#d6945e" stroke-width="1.2" opacity="0.25"/>
        <path d="M-105,150 L-60,95 L-15,150 L30,95 L75,150 L105,115" fill="none" stroke="#d6945e" stroke-width="1.2" opacity="0.25"/>

        <line x1="-100" y1="-75" x2="-100" y2="180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
        <line x1="-93" y1="-70" x2="-93" y2="175" stroke="#d6945e" stroke-width="1" opacity="0.5"/>

        
    <!-- Label Cartouche -->
    <rect x="-85.0" y="-72.5" width="170" height="175" rx="8" fill="#111216" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-80.0" y="-67.5" width="160" height="165" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -46.5)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="-24.5" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#cfc7b8" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-65.0" y1="-16.5" x2="65.0" y2="-16.5" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="27" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="13" font-weight="700" letter-spacing="2" fill="url(#metalG)" text-anchor="middle">KHAMRAH DUKHAN</text>
    
    <line x1="-61.0" y1="64.5" x2="61.0" y2="64.5" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="79.5" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#b0a594" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="92.5" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <path d="M-60,-85 L-35,-120 L35,-120 L60,-85 Z" fill="url(#metalG)"/>
        <rect x="-35" y="-135" width="70" height="20" rx="3" fill="url(#metalG)"/>
        <line x1="-35" y1="-125" x2="35" y2="-125" stroke="#121316" stroke-width="1.5"/>

        <polygon points="-55,-220 55,-220 68,-175 48,-135 -48,-135 -68,-175" fill="url(#metalG)" stroke="#d6945e" stroke-width="1.8"/>
        <polygon points="-35,-220 35,-220 22,-200 -22,-200" fill="#ffffff" opacity="0.25"/>
        <circle cx="0" cy="-175" r="14" fill="#14151a" stroke="url(#metalG)" stroke-width="1.2"/>
        <polygon points="0,-182 3,-177 8,-175 3,-173 0,-168 -3,-173 -8,-175 -3,-177" fill="url(#metalG)"/>
        
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#9c5825" opacity="0.85" text-anchor="middle">SMOKY AMBER WOODY</text>
</svg>