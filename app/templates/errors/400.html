{% extends "base.html" %}
{% block title %}400 - Invalid Request – MUET Shop{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 56px; height: 56px; background-color: var(--bg-raised); color: var(--text-secondary); border: 1px solid var(--border-hairline);">
            <i class="bi bi-exclamation-triangle fs-3 text-warning"></i>
        </div>
        <h1 class="h4 fw-semibold mb-2" style="color: var(--text-primary); letter-spacing: -0.02em;">Invalid request</h1>
        <p class="text-muted small mb-4">
            {{ error_message or "The submitted request could not be processed due to invalid parameters or an expired session." }}
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('cart') }}" class="btn btn-outline-craft btn-sm px-3">
                <i class="bi bi-cart me-1"></i> Return to cart
            </a>
            <a href="{{ url_for('products') }}" class="btn btn-indigo btn-sm px-3">
                <i class="bi bi-arrow-left me-1"></i> Browse catalog
            </a>
        </div>
    </div>
</div>
{% endblock %}
