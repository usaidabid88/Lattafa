{% extends "base.html" %}
{% block title %}404 - Page Not Found – MUET Shop{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-7 col-lg-5 text-center">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 56px; height: 56px; background-color: var(--bg-raised); color: var(--text-secondary); border: 1px solid var(--border-hairline);">
            <i class="bi bi-search fs-3 text-secondary"></i>
        </div>
        <h1 class="h4 fw-semibold mb-2" style="color: var(--text-primary); letter-spacing: -0.02em;">Record not found</h1>
        <p class="text-muted small mb-4">
            The catalog entry, order record, or page you requested could not be located in our database.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="{{ url_for('products') }}" class="btn btn-indigo btn-sm px-3">
                <i class="bi bi-grid me-1"></i> Catalog listing
            </a>
            <a href="{{ url_for('index') }}" class="btn btn-outline-craft btn-sm px-3">
                Storefront home
            </a>
        </div>
    </div>
</div>
{% endblock %}
