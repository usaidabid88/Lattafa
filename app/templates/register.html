{% extends "base.html" %}
{% block title %}Create Account – MUET Shop{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-6 col-lg-5">
        <div class="card-craft p-4">
            <div class="text-center mb-4 pb-2 border-bottom" style="border-color: var(--border-hairline) !important;">
                <h1 class="h5 fw-semibold mb-1" style="color: var(--text-primary); letter-spacing: -0.02em;">Create customer account</h1>
                <p class="text-muted small mb-0">Join our regional Pakistani commerce platform</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="mb-3">
                    <label for="full_name" class="form-label small fw-medium" style="color: var(--text-secondary); font-size: 0.8rem;">Full name *</label>
                    <input type="text" class="form-control form-control-sm" id="full_name" name="full_name" placeholder="e.g. Fatima Noor" style="border-color: var(--border-hairline);" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label small fw-medium" style="color: var(--text-secondary); font-size: 0.8rem;">Email address *</label>
                    <input type="email" class="form-control form-control-sm" id="email" name="email" placeholder="e.g. fatima.noor@example.com" style="border-color: var(--border-hairline);" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-sm-6">
                        <label for="password" class="form-label small fw-medium" style="color: var(--text-secondary); font-size: 0.8rem;">Password *</label>
                        <input type="password" class="form-control form-control-sm" id="password" name="password" placeholder="At least 6 characters" style="border-color: var(--border-hairline);" required>
                    </div>
                    <div class="col-sm-6">
                        <label for="confirm_password" class="form-label small fw-medium" style="color: var(--text-secondary); font-size: 0.8rem;">Confirm password *</label>
                        <input type="password" class="form-control form-control-sm" id="confirm_password" name="confirm_password" placeholder="Repeat password" style="border-color: var(--border-hairline);" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label for="phone" class="form-label small fw-medium" style="color: var(--text-secondary); font-size: 0.8rem;">Phone number (optional)</label>
                    <input type="text" class="form-control form-control-sm" id="phone" name="phone" placeholder="e.g. 03001234567" style="border-color: var(--border-hairline);">
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-2 mb-3">
                    Register account
                </button>
            </form>

            <div class="text-center pt-2 border-top" style="border-color: var(--border-hairline) !important;">
                <span class="text-muted small">Already registered?</span>
                <a href="{{ url_for('login') }}" class="small fw-medium ms-1" style="color: var(--accent-indigo); text-decoration: none;">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
