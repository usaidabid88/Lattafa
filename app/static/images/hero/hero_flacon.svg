<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <defs>
    <!-- Background Halo Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.32"/>
      <stop offset="45%" stop-color="#9a752e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#121318" stop-opacity="0"/>
    </radialGradient>

    <!-- Liquid Amber Gradient -->
    <linearGradient id="amberLiquid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdbb43" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#df891c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#733b04" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Royal Gold Shimmer Gradient -->
    <linearGradient id="royalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db"/>
      <stop offset="30%" stop-color="#e8c474"/>
      <stop offset="65%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#805d1c"/>
    </linearGradient>

    <!-- Crystal Cap Gradient -->
    <linearGradient id="crystalFacet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2620" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#4a3e2e" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#ffd782" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#4a3e2e" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#201d18" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="300" cy="360" r="240" fill="url(#haloGlow)"/>

  <!-- Pedestal Reflection Shadow -->
  <ellipse cx="300" cy="590" rx="190" ry="24" fill="#07080a" opacity="0.85"/>
  <ellipse cx="300" cy="585" rx="140" ry="14" fill="#000000" opacity="0.9"/>

  <!-- Main Flacon Body (Khamrah Heavy Cut Crystal Decanter) -->
  <g id="crystalFlacon" transform="translate(0, 20)">
    <!-- Crystal Body Outer Glass -->
    <rect x="160" y="240" width="280" height="310" rx="20" fill="url(#amberLiquid)" stroke="url(#royalGold)" stroke-width="4"/>
    
    <!-- Heavy Solid Crystal Base -->
    <path d="M162 500 L438 500 L438 532 Q438 548 420 548 L180 548 Q162 548 162 532 Z" fill="#2d1c0b" opacity="0.8" stroke="url(#royalGold)" stroke-width="2"/>
    <line x1="180" y1="524" x2="420" y2="524" stroke="#ffd98a" stroke-width="1.5" opacity="0.4"/>

    <!-- Cut Crystal Diamond Facet Lattice -->
    <g fill="none" stroke="#ffe5a3" stroke-width="1.8" opacity="0.42">
      <!-- Horizontal Cuts -->
      <line x1="162" y1="290" x2="438" y2="290"/>
      <line x1="162" y1="340" x2="438" y2="340"/>
      <line x1="162" y1="390" x2="438" y2="390"/>
      <line x1="162" y1="440" x2="438" y2="440"/>
      <line x1="162" y1="490" x2="438" y2="490"/>

      <!-- Vertical Cuts -->
      <line x1="216" y1="240" x2="216" y2="540"/>
      <line x1="272" y1="240" x2="272" y2="540"/>
      <line x1="328" y1="240" x2="328" y2="540"/>
      <line x1="384" y1="240" x2="384" y2="540"/>

      <!-- Diamond Prisms -->
      <line x1="162" y1="240" x2="438" y2="490"/>
      <line x1="438" y1="240" x2="162" y2="490"/>
      <line x1="162" y1="340" x2="390" y2="540"/>
      <line x1="438" y1="340" x2="210" y2="540"/>
    </g>

    <!-- Glass Specular Highlights (Left and Right Reflections) -->
    <path d="M172 250 L188 250 L188 535 L172 535 Z" fill="#ffffff" opacity="0.22"/>
    <path d="M412 250 L428 250 L428 535 L412 535 Z" fill="#ffffff" opacity="0.12"/>

    <!-- Center Plaque: Lattafa Khamrah Emblem -->
    <rect x="220" y="335" width="160" height="110" rx="8" fill="#14110e" stroke="url(#royalGold)" stroke-width="2.5"/>
    <rect x="226" y="341" width="148" height="98" rx="5" fill="none" stroke="#d5b060" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.6"/>
    
    <text x="300" y="375" font-family="'Cinzel', serif" font-size="19" font-weight="700" letter-spacing="4" fill="url(#royalGold)" text-anchor="middle">LATTAFA</text>
    <line x1="250" y1="386" x2="350" y2="386" stroke="url(#royalGold)" stroke-width="1" opacity="0.7"/>
    <text x="300" y="405" font-family="'Playfair Display', serif" font-size="15" font-style="italic" letter-spacing="2" fill="#f8e7c1" text-anchor="middle">Khamrah</text>
    <text x="300" y="424" font-family="'Inter', sans-serif" font-size="8.5" font-weight="500" letter-spacing="3" fill="#c5a059" text-anchor="middle">EAU DE PARFUM</text>

    <!-- Flacon Collar & Neck (Polished Gold Ring) -->
    <rect x="250" y="212" width="100" height="30" rx="4" fill="url(#royalGold)" stroke="#684a14" stroke-width="1.5"/>
    <line x1="252" y1="222" x2="348" y2="222" stroke="#fff4cf" stroke-width="1.2" opacity="0.8"/>
    <line x1="252" y1="232" x2="348" y2="232" stroke="#523908" stroke-width="1" opacity="0.6"/>

    <!-- Sculpted Cut-Crystal Cap -->
    <path d="M210 110 L390 110 L380 214 L220 214 Z" fill="url(#crystalFacet)" stroke="url(#royalGold)" stroke-width="3"/>
    
    <!-- Cap Crown Multi-Facet Cuts -->
    <g fill="none" stroke="#ffe299" stroke-width="1.4" opacity="0.55">
      <line x1="300" y1="110" x2="300" y2="214"/>
      <line x1="255" y1="110" x2="260" y2="214"/>
      <line x1="345" y1="110" x2="340" y2="214"/>
      <line x1="210" y1="110" x2="300" y2="214"/>
      <line x1="390" y1="110" x2="300" y2="214"/>
      <line x1="210" y1="160" x2="390" y2="160"/>
    </g>

    <!-- Cap Top Bevel -->
    <polygon points="210,110 240,90 360,90 390,110" fill="url(#royalGold)" stroke="#684a14" stroke-width="1.5"/>
    <rect x="260" y="76" width="80" height="15" rx="3" fill="url(#royalGold)" stroke="#684a14" stroke-width="1"/>
  </g>
</svg>