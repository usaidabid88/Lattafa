<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#7c4021" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#1c0b03" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="15%" stop-color="#eab598"/>
      <stop offset="50%" stop-color="#7c4021"/>
      <stop offset="85%" stop-color="#4a350b"/>
      <stop offset="100%" stop-color="#eab598"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1c0b03"/>
      <stop offset="20%" stop-color="#7c4021" stop-opacity="0.75"/>
      <stop offset="48%" stop-color="#eab598" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#eab598" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#7c4021" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#1c0b03"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#eab598" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#eab598" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#7c4021" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#7c4021" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="215" rx="130" ry="20" fill="#000000" opacity="0.65"/>
        <ellipse cx="0" cy="213" rx="90" ry="12" fill="#7c4021" opacity="0.2"/>

        <rect x="-85" y="-115" width="170" height="325" rx="18" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        <rect x="-80" y="165" width="160" height="42" rx="8" fill="url(#baseG)" opacity="0.9"/>
        <line x1="-80" y1="165" x2="80" y2="165" stroke="#eab598" stroke-width="1" opacity="0.6"/>

        <line x1="-72" y1="-105" x2="-72" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
        <line x1="-64" y1="-100" x2="-64" y2="190" stroke="#eab598" stroke-width="1" opacity="0.45"/>

        
    <!-- Label Cartouche -->
    <rect x="-74.0" y="-64.5" width="148" height="185" rx="8" fill="#111216" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-69.0" y="-59.5" width="138" height="175" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -38.5)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="-16.5" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#cfc7b8" text-anchor="middle">MAISON ALHAMBRA</text>
    <line x1="-54.0" y1="-8.5" x2="54.0" y2="-8.5" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="28.0" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="12.2" font-weight="700" letter-spacing="1.6" fill="url(#metalG)" text-anchor="middle"><tspan x="0" dy="0">JEAN LOWE</tspan><tspan x="0" dy="14">NOUVEAU</tspan></text>
    
    <line x1="-50.0" y1="82.5" x2="50.0" y2="82.5" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="97.5" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#b0a594" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="110.5" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <rect x="-32" y="-148" width="64" height="35" rx="3" fill="url(#metalG)"/>
        <rect x="-42" y="-232" width="84" height="88" rx="10" fill="url(#metalG)" stroke="#eab598" stroke-width="1.5"/>
        <circle cx="0" cy="-188" r="12" fill="#121316" stroke="url(#metalG)" stroke-width="1"/>
        <circle cx="0" cy="-238" r="6" fill="url(#metalG)" stroke="#eab598" stroke-width="1"/>
        
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#7c4021" opacity="0.85" text-anchor="middle">LEATHER COCOA OUD</text>
</svg>