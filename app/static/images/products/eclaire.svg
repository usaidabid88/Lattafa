<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#cca059" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#2d1d0c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </radialGradient>
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedcd"/>
      <stop offset="50%" stop-color="#cca059"/>
      <stop offset="100%" stop-color="#4d3509"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2d1d0c"/>
      <stop offset="25%" stop-color="#cca059" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fcedcd" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#cca059" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2d1d0c"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="750" fill="url(#ambG)"/>
  
  <!-- Subtle Framing -->
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#cca059" stroke-width="0.75" opacity="0.3"/>
  <rect x="35" y="35" width="530" height="680" fill="none" stroke="#cca059" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <!-- Bottle Silhouette & Construction -->
  <g transform="translate(300, 360)" filter="url(#dropShadow)">
    <!-- Flacon Pedestal / Shadow -->
    <ellipse cx="0" cy="225" rx="140" ry="24" fill="#000000" opacity="0.6"/>

    <!-- Bottle Main Body -->
    <rect x="-105" y="-120" width="210" height="320" rx="20" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="3"/>

    <!-- Inner Plate / Crest -->
    <rect x="-85" y="-60" width="170" height="200" rx="8" fill="#14151a" stroke="url(#metalG)" stroke-width="1.8"/>
    <circle cx="0" cy="-20" r="18" fill="none" stroke="url(#metalG)" stroke-width="1.2"/>
    <polygon points="0,-30 4,-22 12,-20 4,-18 0,-10 -4,-18 -12,-20 -4,-22" fill="url(#metalG)"/>
    
    <!-- Product Label Typography -->
    <text x="0" y="25" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="700" letter-spacing="2" fill="url(#metalG)" text-anchor="middle">ECLAIRE</text>
    <text x="0" y="52" font-family="'Inter', sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#dfd8cb" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-50" y1="68" x2="50" y2="68" stroke="url(#metalG)" stroke-width="0.8" opacity="0.6"/>
    <text x="0" y="88" font-family="'Inter', sans-serif" font-size="8" letter-spacing="2" fill="#aea28e" text-anchor="middle">Eau de Parfum (EDP)</text>
    <text x="0" y="108" font-family="'Inter', sans-serif" font-size="8" letter-spacing="3" fill="url(#metalG)" text-anchor="middle">100ml</text>

    <!-- Metallic Neck / Collar -->
    <rect x="-42" y="-155" width="84" height="35" rx="4" fill="url(#metalG)"/>
    <line x1="-42" y1="-138" x2="42" y2="-138" stroke="#121316" stroke-width="1.5"/>

    <!-- Regal Cap / Stopper -->
    <rect x="-55" y="-235" width="110" height="80" rx="12" fill="url(#metalG)" stroke="#fcedcd" stroke-width="1.5"/>
    <polygon points="0,-215 5,-195 18,-190 5,-185 0,-165 -5,-185 -18,-190 -5,-195" fill="#15161a"/>
  </g>

  <!-- Bottom Brand Subtitle -->
  <text x="300" y="700" font-family="'Inter', sans-serif" font-size="10" font-weight="500" letter-spacing="5" fill="#cca059" opacity="0.8" text-anchor="middle">CARAMEL GOURMAND</text>
</svg>