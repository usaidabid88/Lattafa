<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#f6ba33" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#3a2602" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="9%" stop-color="#ffefc2"/>
      <stop offset="18%" stop-color="#fff8df" stop-opacity="0.9"/>
      <stop offset="31%" stop-color="#f6ba33"/>
      <stop offset="56%" stop-color="#4a350b"/>
      <stop offset="72%" stop-color="#ffefc2"/>
      <stop offset="86%" stop-color="#17130c"/>
      <stop offset="100%" stop-color="#ffefc2"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="8%" stop-color="#3a2602"/>
      <stop offset="22%" stop-color="#f6ba33" stop-opacity="0.78"/>
      <stop offset="42%" stop-color="#ffefc2" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="53%" stop-color="#ffefc2" stop-opacity="0.98"/>
      <stop offset="74%" stop-color="#f6ba33" stop-opacity="0.82"/>
      <stop offset="92%" stop-color="#3a2602"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="24%" stop-color="#f6ba33" stop-opacity="0.38"/>
      <stop offset="46%" stop-color="#ffefc2" stop-opacity="0.72"/>
      <stop offset="54%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="76%" stop-color="#ffefc2" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2b31"/>
      <stop offset="48%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bloomG" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#ffefc2" stop-opacity="0.24"/>
      <stop offset="42%" stop-color="#f6ba33" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#3a2602" stop-opacity="0"/>
    </radialGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <circle cx="300" cy="300" r="245" fill="url(#bloomG)" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="584" rx="174" ry="26" fill="#000000" opacity="0.42" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="580" rx="126" ry="11" fill="#f6ba33" opacity="0.14"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#f6ba33" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#f6ba33" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="210" rx="135" ry="20" fill="#000000" opacity="0.6"/>
        <ellipse cx="0" cy="208" rx="95" ry="12" fill="#f6ba33" opacity="0.25"/>

        <path d="M-92,-85 Q-75,-10 -95,65 Q-105,120 -82,190 L82,190 Q105,120 95,65 Q75,-10 92,-85 Z" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        
        <path d="M-82,-75 Q-68,0 -84,70 Q-92,115 -74,180" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
        <path d="M-72,-70 Q-60,0 -74,70" fill="none" stroke="#ffefc2" stroke-width="1" opacity="0.5"/>

        <path d="M-86,22 Q0,32 86,22" fill="none" stroke="url(#metalG)" stroke-width="3"/>
        <path d="M-88,28 Q0,38 88,28" fill="none" stroke="url(#metalG)" stroke-width="1" opacity="0.7"/>

        
    <!-- Label Cartouche -->
    <rect x="-78.0" y="-44.0" width="156" height="172" rx="8" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-73.0" y="-39.0" width="146" height="162" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    <rect x="-70.0" y="-36.0" width="140" height="58.5" rx="4" fill="url(#labelSheen)" opacity="0.22"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -18.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="4.0" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="600" letter-spacing="1.8" fill="#e8dcc4" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-58.0" y1="12.0" x2="58.0" y2="12.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="54" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="14.5" font-weight="700" letter-spacing="2" fill="url(#metalG)" text-anchor="middle">YARA TOUS</text>
    
    <line x1="-54.0" y1="90.0" x2="54.0" y2="90.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="105.0" font-family="'Inter', -apple-system, sans-serif" font-size="6.4" font-weight="500" letter-spacing="1.5" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="118.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <path d="M-38,-85 L-28,-122 L28,-122 L38,-85 Z" fill="url(#metalG)"/>
        <rect x="-30" y="-136" width="60" height="16" rx="2" fill="url(#metalG)"/>
        <line x1="-30" y1="-128" x2="30" y2="-128" stroke="#121316" stroke-width="1.2"/>

        <path d="M-48,-136 Q-50,-225 0,-230 Q50,-225 48,-136 Z" fill="url(#metalG)" stroke="#ffefc2" stroke-width="1.5"/>
        <path d="M-38,-140 Q-40,-215 0,-220 Q40,-215 38,-140" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
        <circle cx="0" cy="-233" r="7" fill="url(#metalG)" stroke="#ffefc2" stroke-width="1"/>
        

        <!-- Layered studio specular reflection: broad glass bloom plus a crisp edge catch -->
        <path d="M-67,-62 C-83,18 -84,103 -68,164" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.075"/>
        <path d="M-67,-62 C-83,18 -84,103 -68,164" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.18"/>
        <path d="M-67,-62 C-83,18 -84,103 -68,164" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" opacity="0.78"/>
        <path d="M-67,-62 C-83,18 -84,103 -68,164" fill="none" stroke="#ffefc2" stroke-width="2.4" stroke-linecap="round" opacity="0.34" transform="translate(10,0)"/>
    
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#f6ba33" opacity="0.85" text-anchor="middle">TROPICAL FLORAL FRUITY</text>
</svg>