<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#df8198" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#241016" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="15%" stop-color="#fde1e8"/>
      <stop offset="50%" stop-color="#df8198"/>
      <stop offset="85%" stop-color="#4a350b"/>
      <stop offset="100%" stop-color="#fde1e8"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#241016"/>
      <stop offset="20%" stop-color="#df8198" stop-opacity="0.75"/>
      <stop offset="48%" stop-color="#fde1e8" stop-opacity="0.92"/>
      <stop offset="52%" stop-color="#fde1e8" stop-opacity="0.92"/>
      <stop offset="80%" stop-color="#df8198" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#241016"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#fde1e8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#fde1e8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#df8198" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#df8198" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="210" rx="135" ry="20" fill="#000000" opacity="0.6"/>
        <ellipse cx="0" cy="208" rx="95" ry="12" fill="#df8198" opacity="0.25"/>

        <path d="M-92,-85 Q-75,-10 -95,65 Q-105,120 -82,190 L82,190 Q105,120 95,65 Q75,-10 92,-85 Z" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        
        <path d="M-82,-75 Q-68,0 -84,70 Q-92,115 -74,180" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
        <path d="M-72,-70 Q-60,0 -74,70" fill="none" stroke="#fde1e8" stroke-width="1" opacity="0.5"/>

        <path d="M-86,22 Q0,32 86,22" fill="none" stroke="url(#metalG)" stroke-width="3"/>
        <path d="M-88,28 Q0,38 88,28" fill="none" stroke="url(#metalG)" stroke-width="1" opacity="0.7"/>

        
    <!-- Label Cartouche -->
    <rect x="-78.0" y="-44.0" width="156" height="172" rx="8" fill="#111216" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-73.0" y="-39.0" width="146" height="162" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -18.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="4.0" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#cfc7b8" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-58.0" y1="12.0" x2="58.0" y2="12.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="39" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="12.5" font-weight="700" letter-spacing="2" fill="url(#metalG)" text-anchor="middle"><tspan x="0" dy="0">HAYAATI</tspan><tspan x="0" dy="16">FLORENCE</tspan></text>
    
    <line x1="-54.0" y1="90.0" x2="54.0" y2="90.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="105.0" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="500" letter-spacing="2" fill="#b0a594" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="118.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <path d="M-38,-85 L-28,-122 L28,-122 L38,-85 Z" fill="url(#metalG)"/>
        <rect x="-30" y="-136" width="60" height="16" rx="2" fill="url(#metalG)"/>
        <line x1="-30" y1="-128" x2="30" y2="-128" stroke="#121316" stroke-width="1.2"/>

        <path d="M-48,-136 Q-50,-225 0,-230 Q50,-225 48,-136 Z" fill="url(#metalG)" stroke="#fde1e8" stroke-width="1.5"/>
        <path d="M-38,-140 Q-40,-215 0,-220 Q40,-215 38,-140" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.35"/>
        <circle cx="0" cy="-233" r="7" fill="url(#metalG)" stroke="#fde1e8" stroke-width="1"/>
        
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#df8198" opacity="0.85" text-anchor="middle">FLORAL FRUITY SWEET</text>
</svg>