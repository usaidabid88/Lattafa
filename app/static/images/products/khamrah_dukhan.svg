<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Studio Ambient Lighting & Radial Bloom -->
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#9c5825" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#120a05" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <!-- Polished Stone Pedestal Horizon Gradient -->
    <linearGradient id="pedestalG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c5825" stop-opacity="0.22"/>
      <stop offset="15%" stop-color="#121317" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Metallic Specular Profile -->
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="16%" stop-color="#fff8df" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#d6945e"/>
      <stop offset="65%" stop-color="#9c5825"/>
      <stop offset="85%" stop-color="#2a1f0a"/>
      <stop offset="100%" stop-color="#d6945e"/>
    </linearGradient>

    <!-- Glass Refraction & Body Material -->
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="12%" stop-color="#120a05"/>
      <stop offset="32%" stop-color="#9c5825" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#d6945e" stop-opacity="0.96"/>
      <stop offset="68%" stop-color="#9c5825" stop-opacity="0.82"/>
      <stop offset="88%" stop-color="#120a05"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#d6945e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e34"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="plaqueShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio Background Wall -->
  <rect width="1200" height="1500" fill="url(#ambG)"/>
  
  <!-- Subtle Studio Pedestal Horizon Surface -->
  <rect x="0" y="1100" width="1200" height="400" fill="url(#pedestalG)"/>
  <line x1="0" y1="1100" x2="1200" y2="1100" stroke="#9c5825" stroke-width="0.8" opacity="0.35"/>

  <!-- Multi-Tier Contact Shadows -->
  <ellipse cx="600" cy="1150" rx="340" ry="42" fill="#000000" opacity="0.5" filter="url(#softShadow)"/>
  <ellipse cx="600" cy="1142" rx="250" ry="20" fill="#000000" opacity="0.85"/>

  <!-- Border Passepartout -->
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#9c5825" stroke-width="1.2" opacity="0.28"/>
  <rect x="52" y="52" width="1096" height="1396" fill="none" stroke="#9c5825" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.18"/>

  <!-- Centered Flacon Geometry (Scaled 1.85x into 1200x1500 frame) -->
  <g transform="translate(600, 720) scale(1.85)" filter="url(#flaconShadow)">
    
            <ellipse cx="0" cy="210" rx="145" ry="22" fill="#000000" opacity="0.65"/>
            <rect x="-115" y="-85" width="230" height="280" rx="16" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.8"/>
            <rect x="-110" y="145" width="220" height="45" rx="10" fill="url(#baseG)" opacity="0.95"/>
            <line x1="-110" y1="145" x2="110" y2="145" stroke="#d6945e" stroke-width="1.5" opacity="0.7"/>
            <!-- Cut crystal diamond faceting -->
            <path d="M-105,40 L-60,95 L-15,40 L30,95 L75,40 L105,75" fill="none" stroke="#d6945e" stroke-width="1.4" opacity="0.32"/>
            <path d="M-105,95 L-60,40 L-15,95 L30,40 L75,95 L105,60" fill="none" stroke="#d6945e" stroke-width="1.4" opacity="0.32"/>
            <path d="M-105,95 L-60,150 L-15,95 L30,150 L75,95 L105,130" fill="none" stroke="#d6945e" stroke-width="1.4" opacity="0.32"/>
            <line x1="-100" y1="-75" x2="-100" y2="180" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
            
        <!-- Embossed Label Cartouche Plaque -->
        <g filter="url(#plaqueShadow)">
          <rect x="-86.0" y="-72.0" width="172" height="180" rx="10" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="2.2"/>
          <rect x="-81.0" y="-67.0" width="162" height="170" rx="7" fill="none" stroke="url(#metalG)" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.65"/>
          <rect x="-78.0" y="-64.0" width="156" height="57.6" rx="5" fill="url(#labelSheen)" opacity="0.18"/>
          
          <!-- Crest Emblem -->
          <g transform="translate(0, -48.0)">
            <circle cx="0" cy="0" r="10" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
            <polygon points="0,-6.5 2,-2 6.5,0 2,2 0,6.5 -2,2 -6.5,0 -2,-2" fill="url(#metalG)"/>
          </g>
          
          <!-- Brand Header -->
          <text x="0" y="-27.0" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.2" fill="#e8dcc4" text-anchor="middle">LATTAFA PERFUMES</text>
          <line x1="-68.0" y1="-19.0" x2="68.0" y2="-19.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.55"/>
          
          <!-- Perfume Name -->
          <text x="0" y="26.0" font-family="'Cinzel', serif" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="url(#metalG)" text-anchor="middle">KHAMRAH DUKHAN</text>
          
          <!-- Concentration & Volume Details -->
          <line x1="-64.0" y1="72.0" x2="64.0" y2="72.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.55"/>
          <text x="0" y="86.0" font-family="'Inter', sans-serif" font-size="6.2" font-weight="500" letter-spacing="1.6" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
          <text x="0" y="99.0" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="url(#metalG)" text-anchor="middle">100ML</text>
        </g>
        
            <!-- Atomizer collar & stopper -->
            <path d="M-60,-85 L-35,-125 L35,-125 L60,-85 Z" fill="url(#metalG)"/>
            <rect x="-35" y="-140" width="70" height="22" rx="4" fill="url(#metalG)"/>
            <polygon points="-58,-225 58,-225 72,-175 48,-140 -48,-140 -72,-175" fill="url(#metalG)" stroke="#d6945e" stroke-width="2"/>
            <circle cx="0" cy="-178" r="15" fill="#14151a" stroke="url(#metalG)" stroke-width="1.5"/>
            <polygon points="0,-185 3,-180 8,-178 3,-176 0,-171 -3,-176 -8,-178 -3,-180" fill="url(#metalG)"/>
            
        <!-- Studio Specular Highlights -->
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.08"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.24"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
        
  </g>

  <!-- Bottom Olfactory Classification Tagline -->
  <text x="600" y="1410" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#9c5825" opacity="0.85" text-anchor="middle">SMOKY AMBER WOODY</text>
</svg>