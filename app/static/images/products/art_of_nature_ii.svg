<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#436340" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#0e1a0d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="9%" stop-color="#b2d6af"/>
      <stop offset="18%" stop-color="#fff8df" stop-opacity="0.9"/>
      <stop offset="31%" stop-color="#436340"/>
      <stop offset="56%" stop-color="#4a350b"/>
      <stop offset="72%" stop-color="#b2d6af"/>
      <stop offset="86%" stop-color="#17130c"/>
      <stop offset="100%" stop-color="#b2d6af"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="8%" stop-color="#0e1a0d"/>
      <stop offset="22%" stop-color="#436340" stop-opacity="0.78"/>
      <stop offset="42%" stop-color="#b2d6af" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="53%" stop-color="#b2d6af" stop-opacity="0.98"/>
      <stop offset="74%" stop-color="#436340" stop-opacity="0.82"/>
      <stop offset="92%" stop-color="#0e1a0d"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="24%" stop-color="#436340" stop-opacity="0.38"/>
      <stop offset="46%" stop-color="#b2d6af" stop-opacity="0.72"/>
      <stop offset="54%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="76%" stop-color="#b2d6af" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2b31"/>
      <stop offset="48%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bloomG" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#b2d6af" stop-opacity="0.24"/>
      <stop offset="42%" stop-color="#436340" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0e1a0d" stop-opacity="0"/>
    </radialGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <circle cx="300" cy="300" r="245" fill="url(#bloomG)" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="584" rx="174" ry="26" fill="#000000" opacity="0.42" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="580" rx="126" ry="11" fill="#436340" opacity="0.14"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#436340" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#436340" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="215" rx="145" ry="22" fill="#000000" opacity="0.7"/>
        <ellipse cx="0" cy="213" rx="105" ry="14" fill="#436340" opacity="0.22"/>

        <polygon points="-85,-95 85,-95 110,-50 95,150 75,198 -75,198 -95,150 -110,-50" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        
        <line x1="-85" y1="-95" x2="-75" y2="198" stroke="url(#metalG)" stroke-width="1.2" opacity="0.5"/>
        <line x1="85" y1="-95" x2="75" y2="198" stroke="url(#metalG)" stroke-width="1.2" opacity="0.5"/>
        <line x1="-102" y1="-40" x2="-88" y2="150" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

        
    <!-- Label Cartouche -->
    <rect x="-81.0" y="-51.0" width="162" height="178" rx="8" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-76.0" y="-46.0" width="152" height="168" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    <rect x="-73.0" y="-43.0" width="146" height="60.5" rx="4" fill="url(#labelSheen)" opacity="0.22"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -25.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="-3.0" font-family="'Inter', -apple-system, sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#e8dcc4" text-anchor="middle">LATTAFA PRIDE</text>
    <line x1="-61.0" y1="5.0" x2="61.0" y2="5.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="38.0" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="11.2" font-weight="700" letter-spacing="1.1" fill="url(#metalG)" text-anchor="middle"><tspan x="0" dy="0">ART OF NATURE</tspan><tspan x="0" dy="14">II</tspan></text>
    
    <line x1="-57.0" y1="89.0" x2="57.0" y2="89.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="104.0" font-family="'Inter', -apple-system, sans-serif" font-size="6.4" font-weight="500" letter-spacing="1.5" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="117.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <polygon points="-46,-95 -32,-132 32,-132 46,-95" fill="url(#metalG)"/>
        
        <!-- Sculpted Imperial Finial Cap -->
        <polygon points="-48,-232 48,-232 58,-190 40,-132 -40,-132 -58,-190" fill="url(#metalG)" stroke="#b2d6af" stroke-width="1.8"/>
        <path d="M-25,-232 L0,-255 L25,-232 Z" fill="url(#metalG)" stroke="#b2d6af" stroke-width="1.2"/>
        <circle cx="0" cy="-182" r="13" fill="#121316" stroke="url(#metalG)" stroke-width="1"/>
        <polygon points="0,-189 3,-184 8,-182 3,-180 0,-175 -3,-180 -8,-182 -3,-184" fill="url(#metalG)"/>
        

        <!-- Layered studio specular reflection: broad glass bloom plus a crisp edge catch -->
        <path d="M-72,-72 L-90,132" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.075"/>
        <path d="M-72,-72 L-90,132" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.18"/>
        <path d="M-72,-72 L-90,132" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" opacity="0.78"/>
        <path d="M-72,-72 L-90,132" fill="none" stroke="#b2d6af" stroke-width="2.4" stroke-linecap="round" opacity="0.34" transform="translate(10,0)"/>
    
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#436340" opacity="0.85" text-anchor="middle">HERBAL WOODY MOSS</text>
</svg>