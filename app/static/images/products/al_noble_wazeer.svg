<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#cfa049" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#171513" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="9%" stop-color="#ffe8b3"/>
      <stop offset="18%" stop-color="#fff8df" stop-opacity="0.9"/>
      <stop offset="31%" stop-color="#cfa049"/>
      <stop offset="56%" stop-color="#4a350b"/>
      <stop offset="72%" stop-color="#ffe8b3"/>
      <stop offset="86%" stop-color="#17130c"/>
      <stop offset="100%" stop-color="#ffe8b3"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="8%" stop-color="#171513"/>
      <stop offset="22%" stop-color="#cfa049" stop-opacity="0.78"/>
      <stop offset="42%" stop-color="#ffe8b3" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="53%" stop-color="#ffe8b3" stop-opacity="0.98"/>
      <stop offset="74%" stop-color="#cfa049" stop-opacity="0.82"/>
      <stop offset="92%" stop-color="#171513"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="24%" stop-color="#cfa049" stop-opacity="0.38"/>
      <stop offset="46%" stop-color="#ffe8b3" stop-opacity="0.72"/>
      <stop offset="54%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="76%" stop-color="#ffe8b3" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2b31"/>
      <stop offset="48%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bloomG" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#ffe8b3" stop-opacity="0.24"/>
      <stop offset="42%" stop-color="#cfa049" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#171513" stop-opacity="0"/>
    </radialGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <circle cx="300" cy="300" r="245" fill="url(#bloomG)" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="584" rx="174" ry="26" fill="#000000" opacity="0.42" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="580" rx="126" ry="11" fill="#cfa049" opacity="0.14"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#cfa049" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#cfa049" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="215" rx="140" ry="22" fill="#000000" opacity="0.65"/>
        <ellipse cx="0" cy="213" rx="100" ry="14" fill="#cfa049" opacity="0.2"/>

        <rect x="-105" y="-95" width="210" height="295" rx="22" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        
        <rect x="-98" y="155" width="196" height="40" rx="14" fill="url(#baseG)" opacity="0.9"/>
        <line x1="-98" y1="155" x2="98" y2="155" stroke="#ffe8b3" stroke-width="1" opacity="0.6"/>

        <line x1="-92" y1="-85" x2="-92" y2="185" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
        <line x1="-84" y1="-80" x2="-84" y2="180" stroke="#ffe8b3" stroke-width="1" opacity="0.45"/>

        
    <!-- Label Cartouche -->
    <rect x="-83.0" y="-68.0" width="166" height="180" rx="8" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-78.0" y="-63.0" width="156" height="170" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    <rect x="-75.0" y="-60.0" width="150" height="61.2" rx="4" fill="url(#labelSheen)" opacity="0.22"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -42.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="-20.0" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="600" letter-spacing="1.8" fill="#e8dcc4" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-63.0" y1="-12.0" x2="63.0" y2="-12.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="22.0" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="12.2" font-weight="700" letter-spacing="1.6" fill="url(#metalG)" text-anchor="middle"><tspan x="0" dy="0">AL NOBLE</tspan><tspan x="0" dy="14">WAZEER</tspan></text>
    
    <line x1="-59.0" y1="74.0" x2="59.0" y2="74.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="89.0" font-family="'Inter', -apple-system, sans-serif" font-size="6.4" font-weight="500" letter-spacing="1.5" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="102.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <path d="M-65,-95 L-35,-130 L35,-130 L65,-95 Z" fill="url(#metalG)"/>
        <rect x="-34" y="-145" width="68" height="18" rx="3" fill="url(#metalG)"/>
        <line x1="-34" y1="-136" x2="34" y2="-136" stroke="#121316" stroke-width="1.2"/>

        <rect x="-50" y="-225" width="100" height="82" rx="10" fill="url(#metalG)" stroke="#ffe8b3" stroke-width="1.5"/>
        <circle cx="0" cy="-184" r="15" fill="#121316" stroke="url(#metalG)" stroke-width="1.2"/>
        <polygon points="0,-192 3.5,-186 10,-184 3.5,-182 0,-176 -3.5,-182 -10,-184 -3.5,-186" fill="url(#metalG)"/>
        <circle cx="0" cy="-232" r="7" fill="url(#metalG)" stroke="#ffe8b3" stroke-width="1"/>
        

        <!-- Layered studio specular reflection: broad glass bloom plus a crisp edge catch -->
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.075"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.18"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" opacity="0.78"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffe8b3" stroke-width="2.4" stroke-linecap="round" opacity="0.34" transform="translate(10,0)"/>
    
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#cfa049" opacity="0.85" text-anchor="middle">FRUITY GOURMAND WOODY</text>
</svg>