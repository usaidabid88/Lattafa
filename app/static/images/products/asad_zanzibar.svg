<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500">
  <defs>
    <!-- Studio Ambient Lighting & Radial Bloom -->
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#2b577a" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#091724" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <!-- Polished Stone Pedestal Horizon Gradient -->
    <linearGradient id="pedestalG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b577a" stop-opacity="0.22"/>
      <stop offset="15%" stop-color="#121317" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>

    <!-- Metallic Specular Profile -->
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="16%" stop-color="#fff8df" stop-opacity="0.92"/>
      <stop offset="35%" stop-color="#b5dbfa"/>
      <stop offset="65%" stop-color="#2b577a"/>
      <stop offset="85%" stop-color="#2a1f0a"/>
      <stop offset="100%" stop-color="#b5dbfa"/>
    </linearGradient>

    <!-- Glass Refraction & Body Material -->
    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="12%" stop-color="#091724"/>
      <stop offset="32%" stop-color="#2b577a" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#b5dbfa" stop-opacity="0.96"/>
      <stop offset="68%" stop-color="#2b577a" stop-opacity="0.82"/>
      <stop offset="88%" stop-color="#091724"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#b5dbfa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2e2e34"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#07080a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
    <filter id="plaqueShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Studio Background Wall -->
  <rect width="1200" height="1500" fill="url(#ambG)"/>
  
  <!-- Subtle Studio Pedestal Horizon Surface -->
  <rect x="0" y="1100" width="1200" height="400" fill="url(#pedestalG)"/>
  <line x1="0" y1="1100" x2="1200" y2="1100" stroke="#2b577a" stroke-width="0.8" opacity="0.35"/>

  <!-- Multi-Tier Contact Shadows -->
  <ellipse cx="600" cy="1150" rx="340" ry="42" fill="#000000" opacity="0.5" filter="url(#softShadow)"/>
  <ellipse cx="600" cy="1142" rx="250" ry="20" fill="#000000" opacity="0.85"/>

  <!-- Border Passepartout -->
  <rect x="40" y="40" width="1120" height="1420" fill="none" stroke="#2b577a" stroke-width="1.2" opacity="0.28"/>
  <rect x="52" y="52" width="1096" height="1396" fill="none" stroke="#2b577a" stroke-width="0.6" stroke-dasharray="6,4" opacity="0.18"/>

  <!-- Centered Flacon Geometry (Scaled 1.85x into 1200x1500 frame) -->
  <g transform="translate(600, 720) scale(1.85)" filter="url(#flaconShadow)">
    
            <ellipse cx="0" cy="215" rx="135" ry="22" fill="#000000" opacity="0.65"/>
            <rect x="-95" y="-100" width="190" height="305" rx="28" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.8"/>
            <line x1="-80" y1="-90" x2="-80" y2="195" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.35"/>
            <rect x="-96" y="-60" width="192" height="12" fill="url(#metalG)"/>
            <rect x="-96" y="160" width="192" height="12" fill="url(#metalG)"/>
            
        <!-- Embossed Label Cartouche Plaque -->
        <g filter="url(#plaqueShadow)">
          <rect x="-79.0" y="-45.0" width="158" height="182" rx="10" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="2.2"/>
          <rect x="-74.0" y="-40.0" width="148" height="172" rx="7" fill="none" stroke="url(#metalG)" stroke-width="0.8" stroke-dasharray="4,2" opacity="0.65"/>
          <rect x="-71.0" y="-37.0" width="142" height="58.2" rx="5" fill="url(#labelSheen)" opacity="0.18"/>
          
          <!-- Crest Emblem -->
          <g transform="translate(0, -21.0)">
            <circle cx="0" cy="0" r="10" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
            <polygon points="0,-6.5 2,-2 6.5,0 2,2 0,6.5 -2,2 -6.5,0 -2,-2" fill="url(#metalG)"/>
          </g>
          
          <!-- Brand Header -->
          <text x="0" y="0.0" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.2" fill="#e8dcc4" text-anchor="middle">LATTAFA PERFUMES</text>
          <line x1="-61.0" y1="8.0" x2="61.0" y2="8.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.55"/>
          
          <!-- Perfume Name -->
          <text x="0" y="53.0" font-family="'Cinzel', serif" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="url(#metalG)" text-anchor="middle">ASAD ZANZIBAR</text>
          
          <!-- Concentration & Volume Details -->
          <line x1="-57.0" y1="101.0" x2="57.0" y2="101.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.55"/>
          <text x="0" y="115.0" font-family="'Inter', sans-serif" font-size="6.2" font-weight="500" letter-spacing="1.6" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
          <text x="0" y="128.0" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.8" fill="url(#metalG)" text-anchor="middle">100ML</text>
        </g>
        
            <rect x="-42" y="-138" width="84" height="40" rx="5" fill="url(#metalG)"/>
            <rect x="-52" y="-228" width="104" height="92" rx="14" fill="url(#metalG)" stroke="#b5dbfa" stroke-width="1.8"/>
            <line x1="-36" y1="-222" x2="-36" y2="-140" stroke="#121316" stroke-width="1.4" opacity="0.65"/>
            <line x1="-18" y1="-222" x2="-18" y2="-140" stroke="#121316" stroke-width="1.4" opacity="0.65"/>
            <line x1="0" y1="-222" x2="0" y2="-140" stroke="#121316" stroke-width="1.4" opacity="0.65"/>
            <line x1="18" y1="-222" x2="18" y2="-140" stroke="#121316" stroke-width="1.4" opacity="0.65"/>
            <line x1="36" y1="-222" x2="36" y2="-140" stroke="#121316" stroke-width="1.4" opacity="0.65"/>
            
        <!-- Studio Specular Highlights -->
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.08"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.24"/>
        <path d="M-78,-70 C-90,18 -88,112 -74,172" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
        
  </g>

  <!-- Bottom Olfactory Classification Tagline -->
  <text x="600" y="1410" font-family="'Inter', sans-serif" font-size="16" font-weight="600" letter-spacing="8" fill="#2b577a" opacity="0.85" text-anchor="middle">TROPICAL MARINE AROMATIC</text>
</svg>