<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="600" height="750">
  <defs>
    <radialGradient id="ambG" cx="50%" cy="40%" r="68%">
      <stop offset="0%" stop-color="#2b577a" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#091724" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#08080a"/>
    </radialGradient>
    
    <linearGradient id="metalG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="9%" stop-color="#b5dbfa"/>
      <stop offset="18%" stop-color="#fff8df" stop-opacity="0.9"/>
      <stop offset="31%" stop-color="#2b577a"/>
      <stop offset="56%" stop-color="#4a350b"/>
      <stop offset="72%" stop-color="#b5dbfa"/>
      <stop offset="86%" stop-color="#17130c"/>
      <stop offset="100%" stop-color="#b5dbfa"/>
    </linearGradient>

    <linearGradient id="bodyG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050609"/>
      <stop offset="8%" stop-color="#091724"/>
      <stop offset="22%" stop-color="#2b577a" stop-opacity="0.78"/>
      <stop offset="42%" stop-color="#b5dbfa" stop-opacity="0.9"/>
      <stop offset="48%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="53%" stop-color="#b5dbfa" stop-opacity="0.98"/>
      <stop offset="74%" stop-color="#2b577a" stop-opacity="0.82"/>
      <stop offset="92%" stop-color="#091724"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>

    <linearGradient id="baseG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8"/>
      <stop offset="24%" stop-color="#2b577a" stop-opacity="0.38"/>
      <stop offset="46%" stop-color="#b5dbfa" stop-opacity="0.72"/>
      <stop offset="54%" stop-color="#ffffff" stop-opacity="0.78"/>
      <stop offset="76%" stop-color="#b5dbfa" stop-opacity="0.36"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="labelG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2b31"/>
      <stop offset="48%" stop-color="#111216"/>
      <stop offset="100%" stop-color="#06070a"/>
    </linearGradient>

    <linearGradient id="labelSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="bloomG" cx="50%" cy="45%" r="58%">
      <stop offset="0%" stop-color="#b5dbfa" stop-opacity="0.24"/>
      <stop offset="42%" stop-color="#2b577a" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#091724" stop-opacity="0"/>
    </radialGradient>

    <filter id="flaconShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.8"/>
    </filter>

    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="600" height="750" fill="url(#ambG)"/>
  <circle cx="300" cy="300" r="245" fill="url(#bloomG)" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="584" rx="174" ry="26" fill="#000000" opacity="0.42" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="580" rx="126" ry="11" fill="#2b577a" opacity="0.14"/>
  <rect x="25" y="25" width="550" height="700" fill="none" stroke="#2b577a" stroke-width="0.75" opacity="0.32"/>
  <rect x="33" y="33" width="534" height="684" fill="none" stroke="#2b577a" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <g transform="translate(300, 365)" filter="url(#flaconShadow)">
    
        <ellipse cx="0" cy="215" rx="135" ry="22" fill="#000000" opacity="0.65"/>
        <ellipse cx="0" cy="213" rx="100" ry="14" fill="#2b577a" opacity="0.2"/>

        <rect x="-95" y="-100" width="190" height="305" rx="28" fill="url(#bodyG)" stroke="url(#metalG)" stroke-width="2.5"/>
        
        <line x1="-80" y1="-90" x2="-80" y2="195" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.32"/>
        <line x1="-70" y1="-85" x2="-70" y2="190" stroke="#b5dbfa" stroke-width="1" opacity="0.45"/>
        <line x1="75" y1="-85" x2="75" y2="190" stroke="#b5dbfa" stroke-width="1.5" opacity="0.25"/>

        <rect x="-96" y="-60" width="192" height="10" fill="url(#metalG)"/>
        <rect x="-96" y="160" width="192" height="10" fill="url(#metalG)"/>
        <line x1="-96" y1="-55" x2="96" y2="-55" stroke="#121316" stroke-width="1"/>
        <line x1="-96" y1="165" x2="96" y2="165" stroke="#121316" stroke-width="1"/>

        
    <!-- Label Cartouche -->
    <rect x="-79.0" y="-42.0" width="158" height="180" rx="8" fill="url(#labelG)" stroke="url(#metalG)" stroke-width="1.8"/>
    <rect x="-74.0" y="-37.0" width="148" height="170" rx="5" fill="none" stroke="url(#metalG)" stroke-width="0.75" stroke-dasharray="4,2" opacity="0.6"/>
    <rect x="-71.0" y="-34.0" width="142" height="61.2" rx="4" fill="url(#labelSheen)" opacity="0.22"/>
    
    <!-- Top Emblem / Star -->
    <g transform="translate(0, -16.0)">
      <circle cx="0" cy="0" r="11" fill="none" stroke="url(#metalG)" stroke-width="0.9"/>
      <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="url(#metalG)"/>
    </g>
    
    <!-- Brand Line -->
    <text x="0" y="6.0" font-family="'Inter', -apple-system, sans-serif" font-size="7" font-weight="600" letter-spacing="1.8" fill="#e8dcc4" text-anchor="middle">LATTAFA PERFUMES</text>
    <line x1="-59.0" y1="14.0" x2="59.0" y2="14.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    
    <!-- Perfume Name -->
    <text x="0" y="60" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="13" font-weight="700" letter-spacing="2" fill="url(#metalG)" text-anchor="middle">ASAD ZANZIBAR</text>
    
    <line x1="-55.0" y1="100.0" x2="55.0" y2="100.0" stroke="url(#metalG)" stroke-width="0.6" opacity="0.5"/>
    <!-- Concentration & Volume -->
    <text x="0" y="115.0" font-family="'Inter', -apple-system, sans-serif" font-size="6.4" font-weight="500" letter-spacing="1.5" fill="#c8bba4" text-anchor="middle">EAU DE PARFUM (EDP)</text>
    <text x="0" y="128.0" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="600" letter-spacing="2.5" fill="url(#metalG)" text-anchor="middle">100ML</text>
    

        <rect x="-42" y="-135" width="84" height="38" rx="4" fill="url(#metalG)"/>
        <line x1="-42" y1="-118" x2="42" y2="-118" stroke="#121316" stroke-width="1.5"/>

        <rect x="-52" y="-225" width="104" height="92" rx="14" fill="url(#metalG)" stroke="#b5dbfa" stroke-width="1.5"/>
        <line x1="-36" y1="-220" x2="-36" y2="-138" stroke="#121316" stroke-width="1.2" opacity="0.6"/>
        <line x1="-18" y1="-220" x2="-18" y2="-138" stroke="#121316" stroke-width="1.2" opacity="0.6"/>
        <line x1="0" y1="-220" x2="0" y2="-138" stroke="#121316" stroke-width="1.2" opacity="0.6"/>
        <line x1="18" y1="-220" x2="18" y2="-138" stroke="#121316" stroke-width="1.2" opacity="0.6"/>
        <line x1="36" y1="-220" x2="36" y2="-138" stroke="#121316" stroke-width="1.2" opacity="0.6"/>
        <rect x="-44" y="-232" width="88" height="10" rx="3" fill="url(#metalG)"/>
        

        <!-- Layered studio specular reflection: broad glass bloom plus a crisp edge catch -->
        <path d="M-70,-76 C-82,8 -78,116 -64,181" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" opacity="0.075"/>
        <path d="M-70,-76 C-82,8 -78,116 -64,181" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.18"/>
        <path d="M-70,-76 C-82,8 -78,116 -64,181" fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round" opacity="0.78"/>
        <path d="M-70,-76 C-82,8 -78,116 -64,181" fill="none" stroke="#b5dbfa" stroke-width="2.4" stroke-linecap="round" opacity="0.34" transform="translate(10,0)"/>
    
  </g>

  <text x="300" y="705" font-family="'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="4.5" fill="#2b577a" opacity="0.85" text-anchor="middle">TROPICAL MARINE AROMATIC</text>
</svg>