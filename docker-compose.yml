# docker-compose.yml - Production & Local Demonstration Stack (Phase 13A)
# WHY: Orchestrates MySQL 8 database service and Flask WSGI web application
#      with volume persistence, mutual networking, and automated health checks.

services:
  db:
    image: mysql:8.0.46
    container_name: muet_shop_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-online_shop}
      MYSQL_USER: ${DB_USER:-shopuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shoppass123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-shopuser}", "-p${DB_PASSWORD:-shoppass123}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - shop_net

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: muet_shop_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-shopuser}
      DB_PASSWORD: ${DB_PASSWORD:-shoppass123}
      DB_NAME: ${DB_NAME:-online_shop}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-muet-dbs-production-secret-2026}
      FLASK_ENV: production
      PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./static/images/uploads:/app/static/images/uploads
    networks:
      - shop_net

volumes:
  mysql_data:
    driver: local

networks:
  shop_net:
    driver: bridge
